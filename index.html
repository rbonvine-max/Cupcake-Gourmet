<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cupcake Gourmet</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #fdfbf7; color: #333; }
        h1, h2 { color: #800020; }
        .produto { display: inline-block; width: 220px; padding: 15px; margin: 10px; background: white; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .produto img { width: 150px; height: 150px; object-fit: cover; border-radius: 8px; }
        button { background-color: #800020; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #a00028; }
        #carrinho-container, #checkout-container { margin-top: 30px; background: white; padding: 20px; border-radius: 8px; max-width: 600px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Cupcake Gourmet 🧁</h1>
    <p>Escolha seus sabores favoritos e faça seu pedido!</p>

    <div id="produtos">
        <div class="produto">
            <img src="imagens/chocolate.jpg" alt="Chocolate">
            <h3>Cupcake de Chocolate</h3>
            <p>R$ 8,50</p>
            <button onclick="adicionarAoCarrinho('Cupcake de Chocolate', 8.50)">Adicionar</button>
        </div>
        <div class="produto">
            <img src="imagens/baunilha.jpg" alt="Baunilha">
            <h3>Cupcake de Baunilha</h3>
            <p>R$ 7,50</p>
            <button onclick="adicionarAoCarrinho('Cupcake de Baunilha', 7.50)">Adicionar</button>
        </div>
        <div class="produto">
            <img src="imagens/redvelvet.jpg" alt="Red Velvet">
            <h3>Cupcake Red Velvet</h3>
            <p>R$ 12,00</p>
            <button onclick="adicionarAoCarrinho('Cupcake Red Velvet', 12.00)">Adicionar</button>
        </div>
        <div class="produto">
            <img src="imagens/decorado.jpg" alt="Decorado">
            <h3>Cupcake Decorado</h3>
            <p>R$ 15,00</p>
            <button onclick="adicionarAoCarrinho('Cupcake Decorado', 15.00)">Adicionar</button>
        </div>
    </div>

    <div id="carrinho-container">
        <h2>Meu Carrinho</h2>
        <div id="carrinho">Seu carrinho está vazio.</div>
        <h3 id="total">Total: R$ 0,00</h3>
    </div>

    <div id="checkout-container">
        <h2>Identificação e Endereço</h2>
        <input type="text" id="nomeCliente" placeholder="Nome completo">
        <input type="email" id="emailCliente" placeholder="E-mail">
        <input type="text" id="telefoneCliente" placeholder="Telefone (WhatsApp)">
        <input type="text" id="ruaCliente" placeholder="Rua / Avenida">
        <input type="text" id="numeroCliente" placeholder="Número">
        <input type="text" id="bairroCliente" placeholder="Bairro">
        <input type="text" id="cepCliente" placeholder="CEP">
        <button onclick="continuarCompra()">Continuar para Confirmação</button>
    </div>

    <script>
        let carrinho = [];

        function adicionarAoCarrinho(nome, preco) {
            let produto = carrinho.find(item => item.nome === nome);
            if (produto) {
                produto.quantidade++;
            } else {
                carrinho.push({ nome: nome, preco: preco, quantidade: 1 });
            }
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            let area = document.getElementById("carrinho");
            let total = 0;

            if (carrinho.length === 0) {
                area.innerHTML = "Seu carrinho está vazio.";
                document.getElementById("total").innerText = "Total: R$ 0,00";
                return;
            }

            area.innerHTML = "";
            carrinho.forEach(item => {
                let subtotal = item.preco * item.quantidade;
                total += subtotal;

                area.innerHTML += `
                    <div>
                        <strong>${item.nome}</strong> - Qtd: ${item.quantidade} - R$ ${subtotal.toFixed(2).replace(".", ",")}
                        <button onclick="alterarQuantidade('${item.nome}', 1)">+</button>
                        <button onclick="alterarQuantidade('${item.nome}', -1)">-</button>
                        <button onclick="removerDoCarrinho('${item.nome}')">Remover</button>
                    </div>
                `;
            });

            document.getElementById("total").innerText = "Total: R$ " + total.toFixed(2).replace(".", ",");
        }

        function alterarQuantidade(nome, valor) {
            let produto = carrinho.find(item => item.nome === nome);
            if (produto) {
                produto.quantidade += valor;
                if (produto.quantidade <= 0) {
                    removerDoCarrinho(nome);
                } else {
                    atualizarCarrinho();
                }
            }
        }

        function removerDoCarrinho(nome) {
            carrinho = carrinho.filter(item => item.nome !== nome);
            atualizarCarrinho();
        }

        function continuarCompra() {
            if (carrinho.length === 0) {
                alert("Adicione pelo menos um produto ao carrinho!");
                return;
            }

            const cliente = {
                nome: document.getElementById("nomeCliente").value.trim(),
                email: document.getElementById("emailCliente").value.trim(),
                telefone: document.getElementById("telefoneCliente").value.trim(),
                rua: document.getElementById("ruaCliente").value.trim(),
                numero: document.getElementById("numeroCliente").value.trim(),
                bairro: document.getElementById("bairroCliente").value.trim(),
                cep: document.getElementById("cepCliente").value.trim()
            };

            if (Object.values(cliente).some(valor => !valor)) {
                alert("Preencha todos os campos do cadastro!");
                return;
            }

            const totalGeral = carrinho.reduce((soma, item) => soma + (item.preco * item.quantidade), 0);

            const pedido = {
                cliente: cliente,
                itens: carrinho,
                total: totalGeral,
                data: new Date().toLocaleString('pt-BR')
            };

            localStorage.setItem("pedidoCupcake", JSON.stringify(pedido));
            window.location.href = "confirmacao.html";
        }
    </script>
</body>
</html>
